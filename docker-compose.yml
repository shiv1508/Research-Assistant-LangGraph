services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: research-assistant-backend
    ports:
      - "8000:8000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - TAVILY_API_KEY=${TAVILY_API_KEY}
      - PINECONE_API_KEY=${PINECONE_API_KEY}
      - PINECONE_INDEX_NAME=${PINECONE_INDEX_NAME}
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    volumes:
      - ./backend/database.sqlite:/app/backend/database.sqlite
    networks:
      - research-network
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: research-assistant-frontend
    ports:
      - "8501:8501"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - TAVILY_API_KEY=${TAVILY_API_KEY}
      - PINECONE_API_KEY=${PINECONE_API_KEY}
    depends_on:
      - backend
    networks:
      - research-network
    restart: unless-stopped

  mlflow:
    image: mlfloworg/mlflow:2.5.0
    container_name: research-assistant-mlflow
    ports:
      - "5000:5000"
    environment:
      - MLFLOW_BACKEND_STORE_URI=sqlite:///mlflow.db
      - MLFLOW_DEFAULT_ARTIFACT_ROOT=/mlflow/artifacts
    volumes:
      - ./mlflow:/mlflow
    networks:
      - research-network
    restart: unless-stopped

networks:
  research-network:
    driver: bridge

  mlflow:
    driver: bridge
